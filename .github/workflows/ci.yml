name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Lint + TypeCheck + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: menugran

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: menugran/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: TypeCheck
        run: npm run type-check

      - name: Build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: menugran

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: menugran/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - name: Test
        run: npx vitest run
